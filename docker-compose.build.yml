# 本地构建路径：不使用 GHCR 预构建镜像，镜像名为 star-com-erp-web:local
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# 后端反代地址由 docker-compose.yml 的 BACKEND_UPSTREAM 控制（默认 host.docker.internal:48080），
# 运行时注入，无需构建参数
services:
  web:
    image: star-com-erp-web:local
    pull_policy: never
    build:
      context: .
      dockerfile: scripts/deploy/Dockerfile
