# Star E-Commerce ERP 前端运行时编排
# 镜像由 GitHub Actions 构建并推送 GHCR；部署由 ci.yml 的 deploy job 自动完成：
# push main/test/dev → CI 全绿 → push-image → 经 tailscale SSH 到服务器执行本文件
# 服务器侧目录：/home/edward/star-ecom-erp/<分支>，本文件与 .env 由 CI 每次部署同步覆盖，勿手改
# 可覆盖变量（CI 写入 .env）：IMAGE_TAG / HOST_PORT / CONTAINER_NAME / TS_AUTHKEY / TS_HOSTNAME / BACKEND_UPSTREAM
# 手动更新（默认值即 main 环境）：docker compose pull && docker compose up -d
# 如需本地从零构建，使用 docker-compose.build.yml（本地缺 TS_AUTHKEY 时仅 tailscale 服务无法认证，不影响 web）
services:
  web:
    image: ghcr.io/ellean/star-ecom-erp-web:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-star-ecom-erp-web}
    ports:
      - '${HOST_PORT:-8010}:8080'
    restart: unless-stopped
    pull_policy: always
    # 后端同源反代 upstream（envsubst 渲染进 nginx 配置）；默认指向宿主机 co-located 后端
    environment:
      - BACKEND_UPSTREAM=${BACKEND_UPSTREAM:-host.docker.internal:48080}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # tailscale sidecar：与 web 共享网络命名空间，同一模板随 main/test/dev 三个 project
  # 各部署一份，即得到 3 个独立节点；每个节点开启 Funnel，公网入口为
  # https://<TS_HOSTNAME>.<tailnet>.ts.net → 127.0.0.1:8080（web 容器内 nginx）
  tailscale:
    image: tailscale/tailscale:stable
    container_name: ${CONTAINER_NAME:-star-ecom-erp-web}-tailscale
    network_mode: 'service:web'
    depends_on:
      - web
    restart: unless-stopped
    environment:
      # CI 从 GH Environment secret（main/test/dev 各一个 TS_AUTHKEY）写入 .env；
      # key 需为可复用类型并携带 tag:erp-funnel-xq，见 docs/deploy.md
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-star-ecom-erp-main}
      - TS_AUTH_ONCE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      # 节点状态持久化；具名卷被 COMPOSE_PROJECT_NAME 前缀隔离，三环境互不可见
      - tailscale-state:/var/lib/tailscale
    configs:
      - source: serve
        target: /config/serve.json

# serve 配置内联（需 docker compose ≥ v2.23.1）：
# $${...} 是 compose 转义，字面量 ${TS_CERT_DOMAIN} 由 containerboot 按节点实际域名替换
# AllowFunnel 开启公网 Funnel；443 由 tailscale 终结 TLS，代理到同命名空间的 web
configs:
  serve:
    content: |
      {
        "TCP": {
          "443": {
            "HTTPS": true
          }
        },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": {
              "/": {
                "Proxy": "http://127.0.0.1:8080"
              }
            }
          }
        },
        "AllowFunnel": {
          "$${TS_CERT_DOMAIN}:443": true
        }
      }

volumes:
  tailscale-state:
