name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - test
      - dev

permissions:
  contents: read

env:
  CI: true
  TZ: Asia/Shanghai

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Lint
        run: pnpm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Vitest tests
        run: pnpm run test:unit

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # RUN 步骤非零退出即构建失败，build:antd 报错会原样阻断镜像打包
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build]
    env:
      FAILURE: ${{ contains(join(needs.*.result, ','), 'failure') }}
    steps:
      - name: Check for failure
        run: |
          echo $FAILURE
          if [ "$FAILURE" = "false" ]; then
            exit 0
          else
            exit 1
          fi
