name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - test
      - dev
  workflow_dispatch:
    inputs:
      vite_base_url:
        description: Backend origin baked into the image (VITE_BASE_URL); falls back to branch environment, then repo variable
        required: false
        default: ''
      vite_glob_api_url:
        description: API prefix (VITE_GLOB_API_URL); defaults to <base>/admin-api
        required: false
        default: ''

permissions:
  contents: read

env:
  CI: true
  TZ: Asia/Shanghai
  IMAGE: ghcr.io/ellean/star-ecom-erp-web

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Lint
        run: pnpm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Vitest tests
        run: pnpm run test:unit

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # push/dispatch 按分支解析 vars.VITE_*；PR 的 ref 形如 8/merge 非法，落 'pr' 空环境
    environment: ${{ github.event_name == 'pull_request' && 'pr' || github.ref_name }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve backend URL build args
        id: args
        env:
          BASE_INPUT: ${{ inputs.vite_base_url }}
          BASE_VAR: ${{ vars.VITE_BASE_URL }}
          API_INPUT: ${{ inputs.vite_glob_api_url }}
          API_VAR: ${{ vars.VITE_GLOB_API_URL }}
        run: |
          BASE="${BASE_INPUT:-${BASE_VAR:-http://127.0.0.1:48080}}"
          API="${API_INPUT:-${API_VAR:-${BASE}/admin-api}}"
          echo "vite_base_url=$BASE" >> "$GITHUB_OUTPUT"
          echo "vite_glob_api_url=$API" >> "$GITHUB_OUTPUT"

      - name: Compose image tags
        id: meta
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # PR 的 ref_name 形如 10/merge，含 '/' 非法，需 sanitize（push:false 时 tag 仅作校验）
          REF_TAG="${REF//\//-}"
          TAGS="${IMAGE}:${REF_TAG}
          ${IMAGE}:${SHA}"
          if [ "${REF}" = "main" ]; then
            TAGS="${TAGS}
          ${IMAGE}:latest"
          fi
          {
            echo 'tags<<__TAGS_EOF__'
            echo "$TAGS"
            echo '__TAGS_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # RUN 步骤非零退出即构建失败，build:antd 报错会原样阻断镜像打包
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/deploy/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_BASE_URL=${{ steps.args.outputs.vite_base_url }}
            VITE_GLOB_API_URL=${{ steps.args.outputs.vite_glob_api_url }}
          tags: ${{ steps.meta.outputs.tags }}

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build]
    env:
      FAILURE: ${{ contains(join(needs.*.result, ','), 'failure') }}
    steps:
      - name: Check for failure
        run: |
          echo $FAILURE
          if [ "$FAILURE" = "false" ]; then
            exit 0
          else
            exit 1
          fi
