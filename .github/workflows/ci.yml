name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - test
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  TZ: Asia/Shanghai
  IMAGE: ghcr.io/ellean/star-ecom-erp-web

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # fail-fast:任一并行任务失败立即取消其余任务，直接进入 ci-ok 判定
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Lint
          - name: Test
          - name: Docker Build
    # 本 job 不进入任何 environment：镜像已无 build args，分支 secrets（部署链路）仅 deploy 挂环境使用
    # Docker Build 写 GHCR buildcache 需要 packages:write；Lint/Test 不使用该权限
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.name == 'Docker Build' && 1 || 0 }}

      - name: Setup Node
        if: ${{ matrix.name != 'Docker Build' }}
        uses: ./.github/actions/setup-node

      # eslint 缓存条目按内容哈希失效(vsh lint 用 --cache-strategy content),
      # 跨 run 恢复后未变更文件直接跳过
      - name: Restore eslint cache
        if: ${{ matrix.name == 'Lint' }}
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-

      - name: Lint
        if: ${{ matrix.name == 'Lint' }}
        run: pnpm run lint --parallel

      - name: Vitest tests
        if: ${{ matrix.name == 'Test' }}
        run: pnpm run test:unit

      - name: Compose image tags
        if: ${{ matrix.name == 'Docker Build' }}
        id: meta
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # PR 的 ref_name 形如 10/merge，含 '/' 非法，需 sanitize（本 job 不推送，tag 仅作校验）
          REF_TAG="${REF//\//-}"
          TAGS="${IMAGE}:${REF_TAG}
          ${IMAGE}:${SHA}"
          if [ "${REF}" = "main" ]; then
            TAGS="${TAGS}
          ${IMAGE}:latest"
          fi
          {
            echo 'tags<<__TAGS_EOF__'
            echo "$TAGS"
            echo '__TAGS_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: ${{ matrix.name == 'Docker Build' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ matrix.name == 'Docker Build' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # RUN 步骤非零退出即构建失败，build:antd 报错会原样阻断镜像打包
      - name: Build image
        if: ${{ matrix.name == 'Docker Build' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/deploy/Dockerfile
          push: false
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=gha
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          tags: ${{ steps.meta.outputs.tags }}

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [checks]
    # 上游失败仍执行判定，输出显式红叉；整跑被取消时跳过，防止取消态被判为通过
    if: ${{ !cancelled() }}
    env:
      FAILURE: ${{ contains(join(needs.*.result, ','), 'failure') }}
    steps:
      - name: Check for failure
        run: |
          echo $FAILURE
          if [ "$FAILURE" = "false" ]; then
            exit 0
          else
            exit 1
          fi

  push-image:
    name: Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: ci-ok
    # CI 全绿才推送；PR 事件产物不进 registry
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compose image tags
        id: meta
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # dispatch 选中带 '/' 的分支时兜底（push 事件仅 main/test/dev）
          REF_TAG="${REF//\//-}"
          TAGS="${IMAGE}:${REF_TAG}
          ${IMAGE}:${SHA}"
          if [ "${REF}" = "main" ]; then
            TAGS="${TAGS}
          ${IMAGE}:latest"
          fi
          {
            echo 'tags<<__TAGS_EOF__'
            echo "$TAGS"
            echo '__TAGS_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 缓存由同 run 的 docker-build 写入 GHCR buildcache 镜像（mode=max），此处只读不写，仅组装+推送
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/deploy/Dockerfile
          push: true
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=gha
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: push-image
    # push 仅 main/test/dev 触发；dispatch 选到其他分支时跳过部署（PR 经 needs 自动跳过）
    if: ${{ contains(fromJSON('["main", "test", "dev"]'), github.ref_name) }}
    environment: ${{ github.ref_name }}
    # funnel_url 供 notify 在部署成功时展示环境访问链接（deploy 被跳过时为空）
    outputs:
      funnel_url: ${{ steps.target.outputs.funnel_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions-xq

      - name: Resolve deploy target
        id: target
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER }}
          BASE_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          # 缺配置直接报错中止，避免静默跳过部署
          : "${HOST:?repository variable DEPLOY_HOST is required}"
          : "${SSH_USER:?repository variable DEPLOY_USER is required}"
          BASE_PATH="${BASE_PATH:-/opt/star-ecom-erp}"
          case "${GITHUB_REF_NAME}" in
            # BACKEND_UPSTREAM：nginx 同源反代的 upstream（host 网关 + 后端端口）。
            # 现阶段三环境均指向 co-located 旧后端（48080）；后端新栈（Spring Boot，8020-8022）
            # 上线后，将对应分支的值切换为 host.docker.internal:802x，仅影响下次部署，无需重建镜像
            main) PORT=8010; NAME=star-ecom-erp-web;     TS_HOSTNAME=star-ecom-erp-main; BACKEND_UPSTREAM=host.docker.internal:48080 ;;
            test) PORT=8011; NAME=star-ecom-erp-web-test; TS_HOSTNAME=star-ecom-erp-test;  BACKEND_UPSTREAM=host.docker.internal:48080 ;;
            dev)  PORT=8012; NAME=star-ecom-erp-web-dev;  TS_HOSTNAME=star-ecom-erp-dev;   BACKEND_UPSTREAM=host.docker.internal:48080 ;;
          esac
          {
            echo "host=$HOST"
            echo "user=$SSH_USER"
            echo "dir=${BASE_PATH}/${GITHUB_REF_NAME}"
            echo "port=$PORT"
            echo "name=$NAME"
            echo "tshostname=$TS_HOSTNAME"
            echo "backend_upstream=$BACKEND_UPSTREAM"
            # tailnet 域名固定（见 docs/deploy.md）；换 tailnet 时同步修改此行
            echo "funnel_url=https://${TS_HOSTNAME}.tail08f53.ts.net"
          } >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          : "${SSH_KEY:?repository secret DEPLOY_SSH_KEY is required}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # 服务器上的 compose 文件与 .env 以仓库为唯一事实源，每次部署覆盖同步
      # TS_AUTHKEY 按 environment（main/test/dev）各自配置的同名 secret 解析
      - name: Deploy over SSH
        env:
          HOST: ${{ steps.target.outputs.host }}
          SSH_USER: ${{ steps.target.outputs.user }}
          DIR: ${{ steps.target.outputs.dir }}
          BRANCH: ${{ github.ref_name }}
          HOST_PORT: ${{ steps.target.outputs.port }}
          NAME: ${{ steps.target.outputs.name }}
          TS_HOSTNAME: ${{ steps.target.outputs.tshostname }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          BACKEND_UPSTREAM: ${{ steps.target.outputs.backend_upstream }}
        run: |
          : "${TS_AUTHKEY:?environment secret TS_AUTHKEY is required (main/test/dev 各自配置，见 docs/deploy.md)}"
          printf 'COMPOSE_PROJECT_NAME=star-ecom-erp-%s\nIMAGE_TAG=%s\nHOST_PORT=%s\nCONTAINER_NAME=%s\nTS_HOSTNAME=%s\nTS_AUTHKEY=%s\nBACKEND_UPSTREAM=%s\n' \
            "$BRANCH" "$BRANCH" "$HOST_PORT" "$NAME" "$TS_HOSTNAME" "$TS_AUTHKEY" "$BACKEND_UPSTREAM" > .env.deploy
          # tailnet 内为 WireGuard 加密链路，主机指纹首次信任（TOFU）
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
          ssh $SSH_OPTS "${SSH_USER}@${HOST}" "mkdir -p '${DIR}'"
          scp $SSH_OPTS docker-compose.yml "${SSH_USER}@${HOST}:${DIR}/docker-compose.yml"
          scp $SSH_OPTS .env.deploy "${SSH_USER}@${HOST}:${DIR}/.env"
          rm -f .env.deploy
          ssh $SSH_OPTS "${SSH_USER}@${HOST}" \
            "cd '${DIR}' && docker compose pull && docker compose up -d && docker compose ps && docker image prune -f > /dev/null"

      - name: Verify over tailnet
        env:
          HOST: ${{ steps.target.outputs.host }}
          PORT: ${{ steps.target.outputs.port }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "http://${HOST}:${PORT}/" > /dev/null; then
              echo "OK: http://${HOST}:${PORT}/ is serving"
              exit 0
            fi
            echo "attempt $i/12 not ready, retrying in 5s..."
            sleep 5
          done
          echo "::error::health check failed: http://${HOST}:${PORT}/ unreachable after 60s"
          exit 1

  notify:
    name: WeCom Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci-ok, push-image, deploy]
    # PR 运行（止于 ci-ok）推 PR 群，push/手动触发推 Actions 群；
    # 上游失败或被跳过仍要通知（否则 PR 运行永不发送）；整跑被并发取消时静默，由后继运行补发
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
    env:
      FAILURE: ${{ contains(join(needs.*.result, ','), 'failure') }}
      # 消息标题自报端别：本仓库为前端，后端仓库模板为「后端」，同一企微群可区分来源
      APP_SIDE: 前端
    steps:
      - name: Send WeCom notification
        env:
          GH_TOKEN: ${{ github.token }}
          WECOM_PR_WEBHOOK: ${{ secrets.WECOM_PR_WEBHOOK }}
          WECOM_CI_WEBHOOK: ${{ secrets.WECOM_CI_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          FUNNEL_URL: ${{ needs.deploy.outputs.funnel_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            WEBHOOK="$WECOM_PR_WEBHOOK"
          else
            WEBHOOK="$WECOM_CI_WEBHOOK"
          fi
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::WeCom webhook secret not configured, skip notification"
            exit 0
          fi

          # 失败 job 名单与整跑耗时；notify 自身仍在运行、skipped job 无时间戳，均需过滤 null
          JOBS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs')
          FAILED=$(jq -r '[.[] | select(.conclusion == "failure") | .name] | join("、")' <<<"$JOBS")
          START=$(jq -r '[.[].started_at | select(. != null)] | min' <<<"$JOBS")
          END=$(jq -r '[.[].completed_at | select(. != null)] | max' <<<"$JOBS")
          SECS=$(( $(date -u -d "$END" +%s) - $(date -u -d "$START" +%s) ))
          DUR="$(( SECS / 60 ))m$(( SECS % 60 ))s"

          if [ "$FAILURE" = "true" ]; then
            ICON="❌"; LABEL="失败"
          else
            ICON="✅"; LABEL="成功"
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            HEADLINE="${APP_SIDE} PR CI ${LABEL}"
            TITLE="**[#${PR_NUMBER} ${PR_TITLE}](${PR_URL})**"
            WHO="${PR_AUTHOR} · ${PR_HEAD} → ${PR_BASE}"
          else
            SUBJECT=$(printf '%s\n' "$HEAD_MSG" | head -1)
            if [ -z "$SUBJECT" ]; then
              SUBJECT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq '.commit.message' | head -1)
            fi
            HEADLINE="${APP_SIDE} CI ${LABEL}"
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              HEADLINE="${APP_SIDE} · 手动触发 CI ${LABEL}"
            fi
            TITLE="**${SUBJECT}**"
            WHO="${ACTOR} · ${REF_NAME} · ${SHA:0:8}"
          fi

          # 版式（仅用企微 markdown 支持的语法）：标题 / 关联对象 / 元信息（灰字引用块）/
          # 结果行（失败 job 橙字、部署成功绿字）/ 耗时与运行入口
          {
            echo "## ${ICON} ${HEADLINE}"
            echo ""
            echo "${TITLE}"
            echo ""
            echo "> <font color=\"comment\">👤 ${WHO}</font>"
            if [ -n "$FAILED" ]; then
              echo ""
              echo "⚠️ <font color=\"warning\">失败 job：${FAILED}</font>"
            fi
            if [ "$FAILURE" = "false" ] && [ "$DEPLOY_RESULT" = "success" ]; then
              # 部署成功即 target 步骤已执行，funnel_url 必非空
              echo ""
              echo "🚀 <font color=\"info\">已部署 ${REF_NAME} 环境</font>　[${FUNNEL_URL}](${FUNNEL_URL})"
            fi
            echo ""
            echo "⏱ 耗时 ${DUR} · [查看运行](${RUN_URL})"
          } > /tmp/wecom-msg.md

          PAYLOAD=$(jq -Rs '{msgtype: "markdown", markdown: {content: .}}' /tmp/wecom-msg.md)
          RESP=$(curl -fsS -m 10 --retry 2 --retry-delay 2 -X POST \
            -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK")
          echo "$RESP" | jq -e '.errcode == 0' > /dev/null
          echo "WeCom notified: ${RESP}"
