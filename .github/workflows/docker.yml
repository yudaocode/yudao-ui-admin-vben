name: Docker Build

on:
  push:
    branches:
      - main
      - test
      - dev
  workflow_dispatch:
    inputs:
      vite_base_url:
        description: Backend origin baked into the image (VITE_BASE_URL); falls back to branch environment, then repo variable
        required: false
        default: ''
      vite_glob_api_url:
        description: API prefix (VITE_GLOB_API_URL); defaults to <base>/admin-api
        required: false
        default: ''

env:
  HUSKY: '0'
  IMAGE: ghcr.io/ellean/star-ecom-erp-web

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build and Push Web Image
    runs-on: ubuntu-latest
    # ref_name 即 main/test/dev，使 vars.VITE_* 按环境解析，未命中回落仓库变量/默认值
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve backend URL build args
        id: args
        env:
          BASE_INPUT: ${{ inputs.vite_base_url }}
          BASE_VAR: ${{ vars.VITE_BASE_URL }}
          API_INPUT: ${{ inputs.vite_glob_api_url }}
          API_VAR: ${{ vars.VITE_GLOB_API_URL }}
        run: |
          BASE="${BASE_INPUT:-${BASE_VAR:-http://127.0.0.1:48080}}"
          API="${API_INPUT:-${API_VAR:-${BASE}/admin-api}}"
          echo "vite_base_url=$BASE" >> "$GITHUB_OUTPUT"
          echo "vite_glob_api_url=$API" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/deploy/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_BASE_URL=${{ steps.args.outputs.vite_base_url }}
            VITE_GLOB_API_URL=${{ steps.args.outputs.vite_glob_api_url }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
