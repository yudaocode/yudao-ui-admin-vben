# Fork 专属 CI（ADR 0003）。
# 上游 .github/workflows/ci.yml 带 `if: github.repository == 'vbenjs/vue-vben-admin'`，
# 在本 fork 上所有 job 永远跳过。本 workflow 用互补条件 !=，确保只在 fork 触发，
# 与上游 ci.yml 互不干扰。
name: CI (Team Fork)

on:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'

permissions:
  contents: read

env:
  CI: true
  TZ: Asia/Shanghai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (unit)
    if: github.repository != 'vbenjs/vue-vben-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Vitest tests
        run: pnpm run test:unit

  lint:
    name: Lint
    if: github.repository != 'vbenjs/vue-vben-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Lint
        run: pnpm run lint

  check:
    name: Typecheck
    if: github.repository != 'vbenjs/vue-vben-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      # Turbo 缓存持久化（ADR 0002 方案 B：GitHub Actions cache，无需 Vercel 账号）。
      # 跨 run 复用 turbo 任务缓存，加速 typecheck/build。
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Typecheck
        run: pnpm check:type

  build:
    name: Build (web-antd)
    if: github.repository != 'vbenjs/vue-vben-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # 主交付应用 web-antd；如需全量构建改用 pnpm run build。
      - name: Build web-antd
        run: pnpm run build:antd

  ci-ok:
    name: CI OK
    if: github.repository != 'vbenjs/vue-vben-admin'
    runs-on: ubuntu-latest
    needs: [test, lint, check, build]
    env:
      FAILURE: ${{ contains(join(needs.*.result, ','), 'failure') }}
    steps:
      - name: Check for failure
        run: |
          echo $FAILURE
          if [ "$FAILURE" = "false" ]; then
            exit 0
          else
            exit 1
          fi
