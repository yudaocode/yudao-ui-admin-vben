# Fork 专属 CI（ADR 0003）。
# 上游 .github/workflows/ci.yml 带 `if: github.repository == 'vbenjs/vue-vben-admin'`，
# 在本 fork 上所有 job 永远跳过。本 workflow 用互补条件 !=，确保只在 fork 触发，
# 与上游 ci.yml 互不干扰，实现零 upstream-sync 冲突。
name: CI (Team Fork)

on:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'

permissions:
  contents: read

env:
  CI: true
  TZ: Asia/Shanghai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (unit)
    if: github.repository != 'vbenjs/vue-vben-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Vitest tests
        run: pnpm run test:unit

  lint:
    name: Lint
    if: github.repository != 'vbenjs/vue-vben-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Lint
        run: pnpm run lint

  check:
    name: Typecheck
    if: github.repository != 'vbenjs/vue-vben-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      # Task 5 远程缓存集成位：配置 TURBO_TEAM/TURBO_TOKEN secrets 后自动启用，
      # 未配置时 turbo 自动降级为本地缓存，不影响门禁。
      - name: Typecheck
        env:
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: pnpm check:type

  build:
    name: Build (web-antd)
    if: github.repository != 'vbenjs/vue-vben-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      # 主交付应用 web-antd；如需全量构建改用 pnpm run build。
      - name: Build web-antd
        env:
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: pnpm run build:antd

  ci-ok:
    name: CI OK
    if: github.repository != 'vbenjs/vue-vben-admin'
    runs-on: ubuntu-latest
    needs: [test, lint, check, build]
    env:
      FAILURE: ${{ contains(join(needs.*.result, ','), 'failure') }}
    steps:
      - name: Check for failure
        run: |
          echo $FAILURE
          if [ "$FAILURE" = "false" ]; then
            exit 0
          else
            exit 1
          fi
